[project]
name = "co-lending-control-tower"
version = "0.1.0"
description = "Evidence-first co-lending reconciliation control"
requires-python = ">=3.10"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.116,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.35,<1",
]

[project.scripts]
control-tower-generate = "control_tower.generator.cli:main"
control-tower-evaluate = "control_tower.evaluation.cli:main"
control-tower-web = "control_tower.web.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
control_tower = ["web/ui/dist/**"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
