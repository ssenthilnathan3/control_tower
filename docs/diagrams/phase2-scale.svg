<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540">
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><style>.title{font:700 24px Arial;fill:#0f172a}.zone{font:700 14px Arial;fill:#475569;letter-spacing:1px}.label{font:600 16px Arial;fill:#0f172a}.sub{font:13px Arial;fill:#475569}.box{stroke-width:2;rx:10}.line{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#arrow)}</style></defs>
